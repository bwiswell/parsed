[project]
name = "parsed"
version = "0.2.1"
description = "Typed command trees on seared, for people and agents"
authors = [
    { name = "Benj Wiswell", email = "benjwiswell@gmail.com" },
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "seared>=0.4.4,<0.5.0",
]

[dependency-groups]
dev = [
    "deptry",
    "prek",
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24",
    "ruff",
    "ty",
]

[tool.uv.sources]
# uv doesn't check the range above against a git source, so the tag is what
# pins seared. Moving to a new seared release means moving the tag, then
# `uv lock --upgrade-package seared`.
seared = { git = "https://github.com/bwiswell/seared", tag = "v0.4.4" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsed"]

# The bench ships with the repo, not the package.
[tool.hatch.build.targets.sdist]
exclude = ["/bench"]

[tool.ruff]
line-length = 120
target-version = "py314"
indent-width = 4
# Ruff formats Python code blocks inside Markdown. Off here, as in seared and
# zeared: the docs align declarations into columns deliberately, and some
# ```python blocks show a command's JSON, which the formatter would rewrite.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM",     # comma rules (formatter owns these)
    "CPY",     # copyright notice at top of file
    "FLY",     # str.join -> f-string (we join to avoid the {{}} brace footgun)
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D104",    # missing docstring in public package
    "PLC0415", # allow intentional lazy imports
    "TD",      # TODO formatting
    "FIX002",  # disallow TODOs
    "TRY003",  # long messages outside exception class
]
fixable = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
# `PT012`: testing declaration-time checks means declaring a command inside the
# `pytest.raises` block, which is more than one statement by nature.
"tests/**/*.py" = ["S", "SLF", "ANN", "D", "INP", "ARG", "PLR", "PT012"]
# The bench's product *is* stdout. `PLR2004`: the generated tree's proportions
# (one command in seven, in six…) are its numbers, not magic ones.
"bench/**/*.py" = ["T201"]
"bench/tree.py" = ["T201", "PLR2004"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
quote-style = "single"

[tool.ty.src]
exclude = ["tests"]

[tool.pytest.ini_options]
# The repo root too, so the tests of `bench/` can import the repo-only `bench`
# package. Keep those tests flat in `tests/`: with `tests` on the path, a
# `tests/bench/` package would shadow the real one.
pythonpath = ["tests", "."]
# importlib mode lets test modules of the same name in different directories
# (one per source module, in the matching directory) coexist.
addopts = "--import-mode=importlib"
# An app opens, and calls its handlers, asynchronously: its tests are
# coroutines, run as they're written.
asyncio_mode = "auto"
